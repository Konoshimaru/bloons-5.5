name: Refresh Vite security patch

on:
  push:
    branches:
      - fix/fixed-timestep

permissions:
  contents: write

jobs:
  refresh-vite:
    if: github.event.head_commit.message == 'chore(deps): refresh Vite security patch'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the working branch
        uses: actions/checkout@v4
        with:
          ref: fix/fixed-timestep

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Update Vite to the patched 8.1.7 release
        run: npm install --save-dev --package-lock-only --ignore-scripts vite@8.1.7

      - name: Install the refreshed lockfile
        run: npm ci

      - name: Report dependency security advisories
        run: npm run audit:deps

      - name: Check JavaScript syntax
        run: npm run check:syntax

      - name: Type-check core helpers
        run: npm run typecheck:core

      - name: Run automated tests
        run: npm test

      - name: Build production site
        run: npm run build

      - name: Commit the verified dependency update
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "Vite is already at the requested version; no lockfile update is needed."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore(deps): update Vite to 8.1.7"
          git push origin HEAD:fix/fixed-timestep
