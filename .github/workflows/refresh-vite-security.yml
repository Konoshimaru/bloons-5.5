name: Refresh Vite security patch

on:
  push:
    branches:
      - fix/fixed-timestep

permissions:
  contents: write

jobs:
  refresh-vite:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the working branch
        uses: actions/checkout@v4
        with:
          ref: fix/fixed-timestep

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Check whether this push requested the Vite refresh
        id: guard
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          if [ "$COMMIT_MESSAGE" = "chore(deps): refresh Vite security patch" ]; then
            echo "run_update=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_update=false" >> "$GITHUB_OUTPUT"
            echo "This push did not request a Vite refresh; skipping the one-off update."
          fi

      - name: Update Vite to the patched 8.1.7 release
        if: steps.guard.outputs.run_update == 'true'
        run: npm install --save-dev --package-lock-only --ignore-scripts vite@8.1.7

      - name: Install the refreshed lockfile
        if: steps.guard.outputs.run_update == 'true'
        run: npm ci

      - name: Report dependency security advisories
        if: steps.guard.outputs.run_update == 'true'
        run: npm run audit:deps

      - name: Verify Vite is patched
        if: steps.guard.outputs.run_update == 'true'
        run: |
          npm audit --json > "$RUNNER_TEMP/npm-audit.json" || true
          node tools/verify-vite-audit.mjs "$RUNNER_TEMP/npm-audit.json"

      - name: Check JavaScript syntax
        if: steps.guard.outputs.run_update == 'true'
        run: npm run check:syntax

      - name: Type-check core helpers
        if: steps.guard.outputs.run_update == 'true'
        run: npm run typecheck:core

      - name: Run automated tests
        if: steps.guard.outputs.run_update == 'true'
        run: npm test

      - name: Build production site
        if: steps.guard.outputs.run_update == 'true'
        run: npm run build

      - name: Commit the verified dependency update
        if: steps.guard.outputs.run_update == 'true'
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "Vite is already at the requested version; no lockfile update is needed."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore(deps): update Vite to 8.1.7"
          git push origin HEAD:fix/fixed-timestep
