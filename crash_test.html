<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Crash Test 2.0</title>
    <style>
        body { background: #1a1a1a; color: #0f0; font-family: monospace; padding: 20px; font-size: 16px; }
        #log { white-space: pre-wrap; }
        .error { color: #f00; font-weight: bold; }
    </style>
</head>
<body>
    <h1>Crash Test 2.0 Running...</h1>
    <div id="log">Starting test...<br></div>
    
    <!-- FIX: Added the hidden canvas so GameEngine.init() can find it and get a context -->
    <canvas id="gameCanvas" width="1280" height="720" style="display: none;"></canvas>

    <script type="module">
        import { GameEngine } from './js/engine.js';
        import { Tower } from './js/tower.js';
        import { Enemy } from './js/enemy.js';
        import { GameMap } from './js/map.js';
        import { Config } from './js/config.js';
        import { GLOBAL_SCALE } from './js/constants.js';
        import * as TowerBehavior from './js/towerBehavior.js';
        import { Renderer } from './js/renderer.js';

        const logEl = document.getElementById('log');
        function log(msg, isError = false) {
            const div = document.createElement('div');
            div.innerHTML = msg;
            if (isError) div.className = 'error';
            logEl.appendChild(div);
            console.log(msg);
        }

        // 1. Initialize Config & Engine
        try {
            Config.load();
            GameEngine.init();
            GameEngine.difficulty = { name: "Test", lives: 100, cash: 650, costMod: 1.0, speedMod: 1.0, startRound: 1, maxRound: 40, hpMod: 1.0 };
            GameEngine.gameState = 'playing';
            log("GameEngine initialized.");
        } catch (e) {
            log("INIT FAILED: " + e.message, true);
        }

        // 2. Create a Map
        try {
            GameEngine.map = new GameMap(0);
            log("Map created successfully.");
        } catch (e) {
            log("MAP CREATION FAILED: " + e.message, true);
        }

        // 3. Create a Dart Monkey
        let tower;
        try {
            tower = new Tower(100, 100, 'dart');
            GameEngine.towers.push(tower);
            log("Dart Monkey created. HitRadius: " + tower.hitRadius);
        } catch (e) {
            log("TOWER CREATION FAILED: " + e.message, true);
        }

        // 4. Create a Red Bloon
        let enemy;
        try {
            // FIX: Use the object pool and call init() to properly set up the enemy
            enemy = GameEngine.enemyPool.get();
            enemy.init(1, GameEngine.map, false, false, 1, false, 1.0, 0);
            enemy.x = 110; // Put it right next to the tower
            enemy.y = 100;
            enemy.distanceTraveled = 10; // Ensure it's on the path
            GameEngine.enemies.push(enemy);
            log("Red Bloon created. Radius: " + enemy.radius + " | Alive: " + enemy.alive);
        } catch (e) {
            log("ENEMY CREATION FAILED: " + e.message, true);
        }

        // 5. Simulate Update Loop with Watchdog Timer
        setTimeout(() => {
            log("Starting simulation step...");
            
            // Set a watchdog timer. If this takes longer than 1 second, it's an infinite loop.
            const watchdog = setTimeout(() => {
                log("INFINITE LOOP DETECTED! The browser froze during the update step.", true);
            }, 1000);

            try {
                // Manually clear grid and insert enemy
                GameEngine.enemyGrid.clear();
                for (const e of GameEngine.enemies) GameEngine.enemyGrid.insert(e);

                // Update tower (should target and fire)
                log("Updating tower (calling TowerBehavior.update)...");
                TowerBehavior.update(tower, 0.1, GameEngine);
                log("Tower updated successfully. Projectiles active: " + GameEngine.projectilePool.active.length);

                // Update projectile (should hit bloon)
                if (GameEngine.projectilePool.active.length > 0) {
                    log("Updating projectile...");
                    const p = GameEngine.projectilePool.active[0];
                    // Move projectile directly to bloon to ensure hit
                    p.x = enemy.x;
                    p.y = enemy.y;
                    p.update(0.1);
                    log("Projectile updated. Enemy alive: " + enemy.alive);
                } else {
                    log("Tower did not fire! Check tower cooldown or range.", true);
                }

                // Test Rendering
                log("Testing Renderer...");
                try {
                    Renderer.render(GameEngine, 0.1);
                    log("Renderer completed successfully.");
                } catch (renderErr) {
                    log("RENDER CRASHED: " + renderErr.message, true);
                }

                clearTimeout(watchdog);
                log("Simulation completed without freezing!");
            } catch (e) {
                clearTimeout(watchdog);
                log("SIMULATION CRASHED: " + e.message + "<br>Stack: " + e.stack, true);
            }
        }, 500);
    </script>
</body>
</html>
